name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch: # This allows manual triggering of the workflow

permissions:
  contents: read

# Pin the toolchain the module is actually built and scanned with. GOTOOLCHAIN defaults to
# "auto", which silently uses whatever go.mod's go directive demands and makes the go-version
# pins below meaningless -- including for govulncheck, whose standard-library findings depend
# on the toolchain version it builds with.
#
# The "+auto" suffix makes this a floor rather than an exact pin: never older than go1.27.3
# (which is what keeps the standard-library CVEs fixed), but still free to switch up when a
# module requires newer. An exact pin would break the govulncheck job, which runs
# "go install golang.org/x/vuln/cmd/govulncheck@latest" and needs that freedom.
#
# Keep this in sync with the go-version inputs below and go.mod's "go" directive.
env:
  GOTOOLCHAIN: go1.27.3+auto

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
  govulncheck_job:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: 1.27.3
          go-package: ./...
